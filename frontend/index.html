<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GoldRisk — risk calculator for XAUUSD traders. Calculate position size from account balance, risk amount, entry price, and stop-loss distance." />
    <meta name="theme-color" content="#0d1117" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>GoldRisk — Risk Calculator for XAUUSD Traders</title>
    <script>
      // Apply persisted theme + language before first paint to avoid any flash.
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('goldrisk_theme')
          var lang = localStorage.getItem('goldrisk_lang')
          if (theme === 'light') root.setAttribute('data-theme', 'light')
          root.setAttribute('lang', lang || 'en')
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f4ed' : '#0d1117')
        } catch (e) {
          /* localStorage unavailable — fall through to defaults. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
